[package]
name = "spry"
version = "0.1.0"
edition = "2021"
description = "Spry: a cross-platform pixel art, sprite and animation editor"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "spry"
path = "src/main.rs"

# The acceptance scenarios from docs/BIBLE.md, one module per feature.
[[test]]
name = "features"
path = "tests/features/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
dirs = "6"
eframe = { version = "0.31", default-features = false, features = ["accesskit", "default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
fastrand = "2"
flate2 = "1"
gif = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

# Pixel loops and image codecs are painfully slow unoptimised, even in tests.
[profile.dev.package."*"]
opt-level = 2
